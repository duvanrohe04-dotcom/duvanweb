version: '3.8'

services:
  web:
    build: .
    container_name: duvan_web
    expose:
      - "${PORT:-5001}"
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY}
      - PORT=${PORT:-5001}
      - SITE_NAME=${SITE_NAME:-Duvan Rodriguez}
      - SITE_URL=${SITE_URL:-https://duvanweb.com}
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - coolify
    restart: unless-stopped
    depends_on:
      - postgres-db

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-pg-pass-2026}
      POSTGRES_DB: ${POSTGRES_DB:-master_db}
    ports:
      - "5051:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coolify
    restart: unless-stopped

networks:
  coolify:
    external: true

volumes:
  postgres_data:
