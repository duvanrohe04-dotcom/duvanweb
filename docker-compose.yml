version: '3.8'

services:
  web:
    build: .
    container_name: duvan_web
    expose:
      - "${PORT:-5001}"
    ports:
      - "${PORT:-5001}:${PORT:-5032}"
    # El código va dentro de la imagen Docker (COPY . .).
    # Sin bind mount para evitar que Coolify monte código viejo.
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY}
      - PORT=${PORT:-5001}
      - SITE_NAME=${SITE_NAME:-Duvan Rodriguez}
      - SITE_URL=${SITE_URL:-https://duvanweb.com}
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - coolify
    restart: unless-stopped

networks:
  coolify:
    external: true
