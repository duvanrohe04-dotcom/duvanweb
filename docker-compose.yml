version: '3.8'

services:
  postgres-db:
    image: 'postgres:16-alpine'
    container_name: postgres_prod_central
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-admin}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB:-master_db}'
      POSTGRES_INITDB_ARGS: '--auth-host=md5 --auth-local=md5'
      POSTGRES_HOST_AUTH_METHOD: md5
      TZ: America/Bogota
    command:
      - postgres
      - '-c'
      - shared_buffers=256MB
      - '-c'
      - effective_cache_size=768MB
      - '-c'
      - work_mem=16MB
      - '-c'
      - maintenance_work_mem=128MB
      - '-c'
      - max_connections=100
      - '-c'
      - effective_io_concurrency=200
      - '-c'
      - log_timezone=America/Bogota
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    ports:
      - '5051:5432'
    networks:
      - coolify
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-master_db}'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: .
    container_name: duvan_web
    depends_on:
      postgres-db:
        condition: service_healthy
    expose:
      - "${PORT:-5001}"
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PORT=${PORT:-5001}
      - SITE_NAME=${SITE_NAME:-Duvan Rodriguez}
      - SITE_URL=${SITE_URL:-https://duvanweb.com}
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - coolify
    restart: unless-stopped

  postgres-backup:
    image: 'prodrigestivill/postgres-backup-local:16-alpine'
    container_name: postgres_backup_sidecar
    restart: always
    volumes:
      - 'postgres_backups:/backups'
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-db
      POSTGRES_DB: '${POSTGRES_DB:-master_db}'
      POSTGRES_USER: '${POSTGRES_USER:-admin}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
      TZ: America/Bogota
    networks:
      - coolify

volumes:
  postgres_data:
  postgres_backups:

networks:
  coolify:
    external: true
